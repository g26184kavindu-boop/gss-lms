<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course View - GSS LMS</title>
    <!-- 1. CDN Libraries loaded first (Web Standard) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 2. Core App Logic -->
    <script src="lms-core.js"></script>
    <script src="lms-auth.js"></script>
    <script src="drive-upload.js"></script>
    <style>
        .custom-scroll::-webkit-scrollbar{width:5px}
        .custom-scroll::-webkit-scrollbar-track{background:transparent}
        .custom-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:10px;transition:background .3s}
    </style>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<!-- Dynamic Sidebar -->
<aside class="fixed left-0 top-0 h-screen bg-white shadow-xl z-50 w-20 hover:w-64 transition-all duration-300 ease-in-out flex flex-col justify-between py-6 px-4 group border-r border-gray-100 flex-shrink-0">
    <div class="space-y-8 flex flex-col h-full overflow-hidden">
        <div class="flex items-center space-x-3 overflow-hidden flex-shrink-0">
            <img src="gsspicture.jpg" alt="GSS Logo" class="h-10 w-10 object-contain flex-shrink-0">
            <span class="font-bold text-stone-800 text-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">GSS LMS</span>
        </div>
        <nav id="sidebar-nav" class="space-y-1.5 flex-1 overflow-y-auto overflow-x-hidden pr-1 custom-scroll"></nav>
    </div>
    <div class="text-xs text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex-shrink-0">&copy; 2026 GSS Solution</div>
</aside>

<div class="flex-1 ml-20 p-8 h-full overflow-y-auto">
    <header class="max-w-6xl mx-auto mb-8 flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
        <div>
            <h1 class="text-3xl font-bold text-stone-900 tracking-tight">Available Courses</h1>
            <p class="text-stone-500 text-sm mt-1" id="scope-desc">Select a course to view details and start learning.</p>
        </div>
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full overflow-hidden bg-stone-100 border border-stone-200 flex justify-center items-center flex-shrink-0">
                <img id="user-profile-img" src="" alt="Profile Picture" class="w-full h-full object-cover hidden">
                <svg id="user-default-avatar" class="w-6 h-6 text-stone-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <p class="text-stone-500 text-sm">Welcome back, <span id="user-welcome-name" class="font-bold text-stone-800">User</span></p>
        </div>
    </header>
    <main id="courses-container" class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-12"></main>
</div>

<script>
    const supabaseClient = window.LMS ? window.LMS.db : null;
    const container = document.getElementById('courses-container');

    let courses = [];
    let currentUserRole = 'qat';          // 'super_admin' | 'admin' | 'qat'
    let loggedInUserData = null;

    const DASHBOARDS = { super_admin: 'super-admin-dashboard.html', admin: 'admin-dashboard.html', qat: 'qat-dashboard.html' };
    const isPrivileged = () => currentUserRole === 'super_admin' || currentUserRole === 'admin';
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    /* 1. Session check: Super Admin -> Admin -> QAT */
    function checkUserLoginStatus() {
        if (window.LMS && typeof window.LMS.guard === 'function') {
            window.LMS.guard(['super_admin', 'admin', 'qat']);
        }
        let user = null;
        let role = null;

        const sa = JSON.parse(localStorage.getItem('currentSuperAdmin') || 'null');
        const adm = JSON.parse(localStorage.getItem('currentAdmin') || 'null');
        const qat = JSON.parse(localStorage.getItem('currentQat') || 'null');

        if (sa && sa.user_name && sa.bootstrap !== true) { user = sa; role = 'super_admin'; }
        else if (adm) { user = adm; role = 'admin'; }
        else if (qat) { user = qat; role = 'qat'; }

        if (!user) {
            user = { user_name: 'G26184', name: 'Kavindu Perera (QAT)', qat_g_id: 'G26184', gid: 'G26184', status: 'active' };
            role = 'qat';
            localStorage.setItem('currentQat', JSON.stringify(user));
            localStorage.setItem('currentLmsUserRole', 'qat');
        }

        currentUserRole = role;
        loggedInUserData = user;
        return user;
    }

    function setupSidebarNavigation() {
        if (window.LMS && typeof window.LMS.renderSidebar === 'function') {
            window.LMS.renderSidebar();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const user = checkUserLoginStatus();
        if (!user) return;
        setupSidebarNavigation();

        const name = user.super_admin_name || user.name || user.admin_name || user.full_name || user.username || user.user_name || 'User';
        const suffix = { super_admin: ' (Super Admin)', admin: ' (Admin)', qat: '' }[currentUserRole] || '';
        document.getElementById('user-welcome-name').textContent = name + suffix;

        const scopeDesc = document.getElementById('scope-desc');
        if (currentUserRole === 'admin') {
            scopeDesc.textContent = 'ඔබ විසින් නිර්මාණය කරන ලද පාඨමාලා (Courses created by you).';
        } else if (currentUserRole === 'super_admin') {
            scopeDesc.textContent = 'Departmental and system-wide course directory.';
        }

        if (user.profile_picture && user.profile_picture.trim() !== '') {
            const img = document.getElementById('user-profile-img');
            img.src = user.profile_picture;
            img.classList.remove('hidden');
            document.getElementById('user-default-avatar').classList.add('hidden');
        }
        fetchCourses();
    });

    // Card buttons delegation
    container.addEventListener('click', e => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const { action, id, index, name } = btn.dataset;
        if (action === 'delete') deleteCourse(id, Number(index), btn);
        if (action === 'copy') copyShareLink(id);
        if (action === 'complete') markCourseAsComplete(id, name);
    });

    /* =========================================================================
       FETCH COURSES WITH STRICT DATA ISOLATION
       ========================================================================= */
    async function fetchCourses() {
        container.innerHTML = `<p class="text-stone-500 col-span-full text-center py-8">Loading courses...</p>`;
        const params = new URLSearchParams(window.location.search);
        const single = params.get('single_course_id') || params.get('id') || params.get('enroll');
        const qatGid = loggedInUserData?.qat_g_id || loggedInUserData?.gid || 'G26184';
        const adminGid = loggedInUserData?.admin_g_id || loggedInUserData?.gid || '';

        // Auto-enroll if QAT navigated via link
        if (single && currentUserRole === 'qat') {
            try {
                const k = 'gss_enrolled_courses_' + qatGid;
                const cur = JSON.parse(localStorage.getItem(k) || '[]');
                if (!cur.includes(String(single))) {
                    cur.push(String(single));
                    localStorage.setItem(k, JSON.stringify(cur));
                }
            } catch (e) {}
        }

        let data = null;
        if (supabaseClient) {
            try {
                let query = supabaseClient.from('courses').select('*');
                if (single && currentUserRole !== 'qat' && currentUserRole !== 'admin') {
                    const clean = single.trim();
                    query = !isNaN(clean) ? query.or(`id.eq.${clean},id.eq.${Number(clean)}`) : query.eq('id', clean);
                }
                const res = await query;
                if (!res.error && res.data && res.data.length) {
                    data = res.data;
                }
            } catch (err) {
                console.warn('Supabase fetch notice:', err.message);
            }
        }

        const localCourses = JSON.parse(localStorage.getItem('gss_courses') || '[]');
        let combined = [...(data || [])];
        localCourses.forEach(lc => {
            const lcId = String(lc.id || lc.course_id);
            if (!combined.some(c => String(c.id || c.course_id) === lcId)) {
                combined.unshift(lc);
            }
        });

        // ---------------------------------------------------------------------
        // STRICT ROLE-BASED ISOLATION
        // ---------------------------------------------------------------------
        if (currentUserRole === 'qat') {
            // 1. QAT: Sees ONLY permitted or completed courses
            const enrolledList = JSON.parse(localStorage.getItem('gss_enrolled_courses_' + qatGid) || '[]');
            let completedList = [];
            if (supabaseClient) {
                try {
                    const doneRes = await supabaseClient.from('qat_completed_courses').select('course_id').eq('gid', qatGid);
                    if (doneRes.data) completedList = doneRes.data.map(d => String(d.course_id));
                } catch (e) {}
            }

            const permittedIds = new Set([...enrolledList.map(String), ...completedList.map(String)]);
            courses = combined.filter(c => {
                const cid = String(c.id || c.course_id);
                const isAssigned = c.qat_id && (String(c.qat_id) === String(qatGid) || String(c.qat_id).toLowerCase() === 'all');
                return permittedIds.has(cid) || isAssigned;
            });

        } else if (currentUserRole === 'admin') {
            // 2. ADMIN ISOLATION: Admin sees ONLY courses created by THEMSELVES!
            courses = combined.filter(c => String(c.created_by).trim() === String(adminGid).trim());

        } else if (currentUserRole === 'super_admin') {
            // 3. SUPER ADMIN: Department-wise or General (All)
            if (loggedInUserData?.department && loggedInUserData.department !== 'General' && loggedInUserData.department !== 'All') {
                const myDept = loggedInUserData.department.toLowerCase();
                courses = combined.filter(c => (c.department || 'Training').toLowerCase() === myDept);
            } else {
                courses = combined;
            }
        }

        renderCourses();
    }

    /* Smart Share Link Generator */
    function copyShareLink(courseId) {
        const course = courses.find(c => String(c.id || c.course_id) === String(courseId));
        const s = LMS.getSession();

        const adminGid = (course && course.created_by) || s?.gid || s?.user?.admin_g_id || 'Admin';
        const dept = (course && course.department) || s?.user?.department || 'Training';

        const shareUrl = `${window.location.origin}/course-learning-flow.html?id=${encodeURIComponent(courseId)}&ref_admin=${encodeURIComponent(adminGid)}&dept=${encodeURIComponent(dept)}`;

        navigator.clipboard.writeText(shareUrl)
            .then(() => {
                alert(`QAT Share Link Copied Successfully!\n\n${shareUrl}\n\nමෙම link එක QAT ට ලබා දෙන්න. ඔහු මේ හරහා පාඨමාලාවට සම්බන්ධ වූ විට:\n• Admin: ${adminGid}\n• Department: ${dept}\nලෙස පද්ධතිය තුළ ස්වයංක්‍රීයව Tag වේ.`);
            })
            .catch(() => alert(`Share URL:\n${shareUrl}`));
    }

    function renderCourses() {
        container.innerHTML = '';
        if (!courses.length) {
            if (currentUserRole === 'admin') {
                container.innerHTML = `
                <div class="col-span-full bg-white p-8 rounded-2xl border border-gray-100 text-center space-y-3 shadow-sm">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    </div>
                    <h3 class="text-base font-bold text-stone-800">ඔබ තවමත් කිසිදු පාඨමාලාවක් සාදා නැත</h3>
                    <p class="text-xs sm:text-sm text-stone-500 max-w-md mx-auto">ඔබ විසින් නිර්මාණය කරන පාඨමාලා පමණක් මෙහි දිස්වේ. නව පාඨමාලාවක් එක් කිරීමට පහත බොත්තම ඔබන්න.</p>
                    <div class="pt-2">
                        <a href="course-add.html" class="inline-block px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-xs transition shadow-sm">+ Add New Course</a>
                    </div>
                </div>`;
            } else if (currentUserRole === 'qat') {
                container.innerHTML = `
                <div class="col-span-full bg-white p-8 rounded-2xl border border-gray-100 text-center space-y-3 shadow-sm">
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <h3 class="text-base font-bold text-stone-800">නව පාඨමාලා සබැඳියක් (Course Link) අවශ්‍යයි</h3>
                    <p class="text-xs sm:text-sm text-stone-500 max-w-md mx-auto">Admin විසින් ලබාදෙන Share Link එක හරහා පාඨමාලාවට සම්බන්ධ වන්න.</p>
                </div>`;
            } else {
                container.innerHTML = `<p class="text-stone-500 col-span-full text-center py-8">No courses available for this department.</p>`;
            }
            return;
        }

        const gradients = ['from-blue-600 to-indigo-700', 'from-emerald-600 to-teal-700', 'from-purple-600 to-violet-700', 'from-amber-600 to-orange-700', 'from-rose-600 to-pink-700'];

        courses.forEach((course, index) => {
            const courseName = course.name || course.course_name || 'Unnamed Course';
            const courseId = course.id || course.course_id || 'N/A';
            const format = course.format || 'N/A';
            const category = course.category || 'General';
            const lesson = course.lesson || course.lessonTitle || 'Course Module';
            const courseDept = course.department || 'Training';
            const creator = course.created_by || 'Admin';

            // Delete permission: Super Admin or Course Owner Admin
            const adminGid = loggedInUserData?.admin_g_id || loggedInUserData?.gid;
            const canDelete = currentUserRole === 'super_admin' || (currentUserRole === 'admin' && String(course.created_by) === String(adminGid));

            const deleteBtn = canDelete ? `
            <button data-action="delete" data-id="${esc(courseId)}" data-index="${index}" class="py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 font-semibold rounded-xl shadow-sm transition text-xs">Delete</button>` : '';

            const shareBtn = isPrivileged() ? `
            <div class="mt-3 pt-3 border-t border-gray-100">
                <button data-action="copy" data-id="${esc(courseId)}" class="w-full py-2 px-3 bg-stone-100 hover:bg-stone-200 text-stone-700 text-xs font-semibold rounded-xl transition flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    <span>Copy Shareable Link for QAT</span>
                </button>
            </div>` : '';

            const card = document.createElement('div');
            card.className = 'bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col justify-between';
            card.innerHTML = `
            <div>
                <div class="h-40 bg-gradient-to-br ${gradients[index % gradients.length]} p-6 flex flex-col justify-between text-white shadow-inner">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-semibold px-2.5 py-1 bg-white/20 backdrop-blur-md rounded-full tracking-wide">ID: ${esc(courseId)}</span>
                        <span class="text-[10px] font-bold px-2 py-0.5 bg-black/25 rounded-md text-stone-100 uppercase">${esc(courseDept)} Dept</span>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold tracking-tight truncate">${esc(courseName)}</h3>
                        <p class="text-xs text-stone-100 opacity-90 mt-0.5 truncate">${esc(lesson)}</p>
                    </div>
                </div>
                <div class="p-6 space-y-2.5">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-stone-500">Format: <b class="text-stone-800">${esc(format)}</b></span>
                        <span class="text-stone-500">By: <b class="text-blue-600 font-mono">${esc(creator)}</b></span>
                    </div>
                </div>
            </div>
            <div class="p-6 pt-0 flex flex-col gap-2">
                <div class="flex gap-2">
                    <a href="course-learning-flow.html?id=${encodeURIComponent(courseId)}&name=${encodeURIComponent(courseName)}&format=${encodeURIComponent(format)}&ref_admin=${encodeURIComponent(creator)}&dept=${encodeURIComponent(courseDept)}" class="flex-1 py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white text-center font-semibold rounded-xl shadow-sm transition text-xs">View Course</a>
                    ${deleteBtn}
                </div>
                ${shareBtn}
            </div>`;
            container.appendChild(card);
        });
    }

    async function deleteCourse(courseId, index, deleteBtn) {
        const course = courses[index];
        if (!course) return;

        const adminGid = loggedInUserData?.admin_g_id || loggedInUserData?.gid;
        if (currentUserRole === 'admin' && String(course.created_by) !== String(adminGid)) {
            return alert('You do not have permission to delete courses created by other administrators.');
        }

        if (!confirm('Are you sure you want to delete this course from the system?')) return;

        deleteBtn.disabled = true;
        deleteBtn.innerText = 'Deleting...';

        try {
            if (supabaseClient) {
                const { error } = await supabaseClient.from('courses').delete().eq('id', courseId);
                if (error) throw error;
            }
            alert('Course deleted successfully!');
            fetchCourses();
        } catch (err) {
            alert('Error deleting course: ' + err.message);
            deleteBtn.disabled = false;
            deleteBtn.innerText = 'Delete';
        }
    }
</script>
</body>
</html>
