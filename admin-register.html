<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Register - GSS LMS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lms-core.js"></script>
    <script src="lms-auth.js"></script>
    <script>LMS.guard(['admin', 'super_admin']);</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<aside class="fixed left-0 top-0 h-screen bg-white shadow-xl z-50 w-20 hover:w-64 transition-all duration-300 ease-in-out flex flex-col justify-between py-6 px-4 group border-r border-gray-100 flex-shrink-0">
    <div class="space-y-8 flex flex-col h-full overflow-hidden">
        <div class="flex items-center space-x-3 overflow-hidden flex-shrink-0">
            <img src="gsspicture.jpg" alt="GSS Logo" class="h-10 w-10 object-contain flex-shrink-0">
            <span class="font-bold text-stone-800 text-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">GSS LMS</span>
        </div>
        <nav id="sidebar-nav" class="space-y-1.5 flex-1 overflow-y-auto overflow-x-hidden pr-1 custom-scroll"></nav>
    </div>
    <div class="text-xs text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex-shrink-0">&copy; 2026 GSS Solution</div>
</aside>

<div class="flex-1 ml-20 p-8 h-full overflow-y-auto">
    <main class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 mb-8">
        <h1 class="text-3xl font-semibold text-stone-950 tracking-tight mb-2">Admin Register</h1>
        <p class="text-stone-600 text-sm mb-6">Register a new Department Admin into the system with unique credentials.</p>

        <form id="admin-register-form" class="space-y-4">
            <div>
                <label for="admin-user-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">User Name <span class="text-rose-500">*</span></label>
                <input type="text" id="admin-user-name" placeholder="e.g. kn26184" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="admin-id" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Admin G ID <span class="text-rose-500">*</span></label>
                <input type="text" id="admin-id" placeholder="e.g. G26184" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="admin-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Admin Name <span class="text-rose-500">*</span></label>
                <input type="text" id="admin-name" placeholder="Enter full name" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- Department Selection -->
            <div>
                <label for="admin-dept" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Department <span class="text-rose-500">*</span></label>
                <select id="admin-dept" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                    <option value="" disabled selected>Select Department</option>
                    <option value="Training">Training Department</option>
                    <option value="HR">HR Department</option>
                    <option value="QA">Quality Assurance Department</option>
                    <option value="Operations">Operations Department</option>
                </select>
            </div>

            <div>
                <label for="admin-email" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Biz Mail Address <span class="text-rose-500">*</span></label>
                <input type="email" id="admin-email" placeholder="kavindu_n@gssintl.biz" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-[11px] text-stone-400 mt-1">Must be an official GSS email ending with @gssintl.biz</p>
            </div>

            <div>
                <label for="admin-tel" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Contact <span class="text-rose-500">*</span></label>
                <input type="tel" id="admin-tel" placeholder="07XXXXXXXX" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="company-join-date" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Company Join Date <span class="text-rose-500">*</span></label>
                <input type="date" id="company-join-date" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="admin-password" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Password <span class="text-rose-500">*</span></label>
                <input type="password" id="admin-password" placeholder="Enter password" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label for="admin-confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Confirm Password <span class="text-rose-500">*</span></label>
                <input type="password" id="admin-confirm-password" placeholder="Confirm password" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="pt-3">
                <button type="submit" id="register-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm transition">
                    Register Admin
                </button>
            </div>
        </form>
    </main>
</div>

<script>
    const supabaseClient = window.LMS.db;
    const esc = LMS.esc;
    const qv = LMS.postgrestVal;

    async function loadDepts() {
        try {
            const { data } = await supabaseClient.from('departments').select('name');
            if (data && data.length) {
                const sel = document.getElementById('admin-dept');
                sel.innerHTML = '<option value="" disabled selected>Select Department</option>' +
                    data.filter(d => d.name && d.name.toLowerCase() !== 'general')
                        .map(d => `<option value="${esc(d.name)}">${esc(d.name)} Department</option>`).join('');
            }
        } catch (_) {}
    }

    document.addEventListener("DOMContentLoaded", function() {
        LMS.renderSidebar();
        loadDepts();

        const form = document.getElementById('admin-register-form');
        const registerBtn = document.getElementById('register-btn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const gid = document.getElementById('admin-id').value.trim();
            const username = document.getElementById('admin-user-name').value.trim();
            const email = document.getElementById('admin-email').value.trim().toLowerCase();
            const dept = document.getElementById('admin-dept').value;
            const password = document.getElementById('admin-password').value;
            const confirmPassword = document.getElementById('admin-confirm-password').value;

            if (!email.endsWith('@gssintl.biz')) {
                return alert("Error: Official email must end with '@gssintl.biz'");
            }
            if (password !== confirmPassword) {
                return alert("Passwords do not match!");
            }
            if (password.length < 8) {
                return alert("Password must be at least 8 characters long.");
            }

            registerBtn.innerText = "Checking uniqueness...";
            registerBtn.disabled = true;

            try {
                const [admCheck, qatCheck, saCheck] = await Promise.all([
                    supabaseClient.from('admins').select('id').or(`admin_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},email.ilike.${qv(email)}`),
                    supabaseClient.from('qats').select('id').or(`qat_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},email.ilike.${qv(email)}`),
                    supabaseClient.from('super_admin').select('id').or(`super_admin_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},biz_mail.ilike.${qv(email)}`)
                ]);

                if ((admCheck.data?.length > 0) || (qatCheck.data?.length > 0) || (saCheck.data?.length > 0)) {
                    registerBtn.innerText = "Register Admin";
                    registerBtn.disabled = false;
                    return alert(`මෙම G ID (${gid}), Username (${username}) හෝ Email ලිපිනය පද්ධතියේ වෙනත් අයෙකු විසින් දැනටමත් භාවිත කර ඇත!`);
                }

                registerBtn.innerText = "Registering...";

                const newAdmin = {
                    user_name: username,
                    admin_g_id: gid,
                    admin_name: document.getElementById('admin-name').value.trim(),
                    department: dept,
                    email: email,
                    contact: document.getElementById('admin-tel').value.trim(),
                    company_join_date: document.getElementById('company-join-date').value,
                    password: password,
                    confirm_password: confirmPassword,
                    status: 'Active'
                };

                const { error } = await supabaseClient.from('admins').insert([newAdmin]);
                if (error) throw error;

                alert(`Admin (${dept} Department) Registered Successfully!`);
                form.reset();
                window.location.href = 'admin-details.html';
            } catch (err) {
                alert('Database Error: ' + err.message);
                registerBtn.innerText = "Register Admin";
                registerBtn.disabled = false;
            }
        });
    });
</script>
</body>
</html>
