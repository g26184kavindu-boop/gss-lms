<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QAT Register - GSS LMS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lms-core.js"></script>
    <script src="lms-auth.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans min-h-screen p-6">

<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-sm border border-gray-100 my-8">
    <div class="flex justify-between items-center border-b pb-4 mb-6">
        <div>
            <h1 class="text-2xl font-bold text-stone-900">QAT Registration</h1>
            <p class="text-xs text-stone-500 mt-0.5">Create your account to start learning</p>
        </div>
        <a href="index.html" class="text-xs font-semibold text-blue-600 hover:underline">Back to Login</a>
    </div>

    <form id="qat-register-form" class="space-y-4">
        <div>
            <label for="qat-user-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">User Name <span class="text-rose-500">*</span></label>
            <input type="text" id="qat-user-name" placeholder="e.g. kn26184" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-id" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">QAT G ID <span class="text-rose-500">*</span></label>
            <input type="text" id="qat-id" placeholder="Enter QAT G ID (e.g. Q1001)" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Full Name <span class="text-rose-500">*</span></label>
            <input type="text" id="qat-name" placeholder="Enter full name" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-email" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Email Address <span class="text-rose-500">*</span></label>
            <input type="email" id="qat-email" placeholder="example@gmail.com" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-tel" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Contact Number <span class="text-rose-500">*</span></label>
            <input type="tel" id="qat-tel" placeholder="07XXXXXXXX" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-password" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Password <span class="text-rose-500">*</span></label>
            <input type="password" id="qat-password" placeholder="At least 8 characters" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
            <label for="qat-confirm-password" class="block text-xs font-semibold uppercase tracking-wider text-stone-700 mb-1">Confirm Password <span class="text-rose-500">*</span></label>
            <input type="password" id="qat-confirm-password" placeholder="Confirm password" required class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-xl shadow-sm transition">
            Create Account &amp; Continue
        </button>
    </form>
</div>

<script>
    const supabaseClient = window.LMS.db;
    const qv = LMS.postgrestVal;
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect');
    const isSafe = u => !!u && !/^[a-z][a-z0-9+.-]*:/i.test(u) && !u.startsWith('//');

    document.getElementById('qat-register-form').addEventListener('submit', async function(e) {
        e.preventDefault();

        const gid = document.getElementById('qat-id').value.trim();
        const username = document.getElementById('qat-user-name').value.trim();
        const email = document.getElementById('qat-email').value.trim().toLowerCase();
        const password = document.getElementById('qat-password').value;
        const confirmPassword = document.getElementById('qat-confirm-password').value;
        const btn = document.getElementById('submit-btn');

        if (password !== confirmPassword) return alert("Passwords do not match!");
        if (password.length < 8) return alert("Password must be at least 8 characters long.");

        btn.disabled = true;
        btn.innerText = "Checking Uniqueness...";

        try {
            const [admCheck, qatCheck, saCheck] = await Promise.all([
                supabaseClient.from('admins').select('id').or(`admin_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},email.ilike.${qv(email)}`),
                supabaseClient.from('qats').select('id').or(`qat_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},email.ilike.${qv(email)}`),
                supabaseClient.from('super_admin').select('id').or(`super_admin_g_id.ilike.${qv(gid)},user_name.ilike.${qv(username)},biz_mail.ilike.${qv(email)}`)
            ]);

            if ((admCheck.data?.length > 0) || (qatCheck.data?.length > 0) || (saCheck.data?.length > 0)) {
                btn.disabled = false;
                btn.innerText = "Create Account & Continue";
                return alert(`මෙම G ID (${gid}), Username (${username}) හෝ Email එක දැනටමත් භාවිතයේ පවතී.`);
            }

            btn.innerText = "Registering...";

            let refAdmin = null, refDept = null, refCourse = null;
            if (redirectUrl && isSafe(redirectUrl)) {
                try {
                    const parsed = new URL(decodeURIComponent(redirectUrl), window.location.origin);
                    refAdmin = parsed.searchParams.get('ref_admin');
                    refDept = parsed.searchParams.get('dept');
                    refCourse = parsed.searchParams.get('id');
                } catch (_) {}
            }

            const newQat = {
                user_name: username,
                qat_g_id: gid,
                name: document.getElementById('qat-name').value.trim(),
                email: email,
                contact: document.getElementById('qat-tel').value.trim(),
                join_date: new Date().toISOString().split('T')[0],
                password: password,
                status: 'Active',
                ...(refAdmin ? { registered_via_admin: refAdmin } : {}),
                ...(refDept ? { department: refDept } : {}),
                ...(refCourse ? { registered_via_course: refCourse } : {})
            };

            const { error: insErr } = await supabaseClient.from('qats').insert([newQat]);
            if (insErr) throw insErr;

            localStorage.setItem('currentQat', JSON.stringify(newQat));
            localStorage.setItem('currentLmsUserRole', 'qat');
            sessionStorage.setItem('lms_online_since', String(Date.now()));

            alert("Account created successfully! Loading your course...");

            if (redirectUrl && isSafe(redirectUrl)) {
                window.location.href = decodeURIComponent(redirectUrl);
            } else {
                window.location.href = 'qat-dashboard.html';
            }
        } catch (err) {
            alert("Registration error: " + err.message);
            btn.disabled = false;
            btn.innerText = "Create Account & Continue";
        }
    });
</script>
</body>
</html>
