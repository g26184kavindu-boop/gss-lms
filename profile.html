<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - GSS LMS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="lms-core.js"></script>
    <script src="lms-auth.js"></script>
    <script>LMS.guard(['super_admin', 'admin', 'qat']);</script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: transparent; border-radius: 10px; transition: background 0.3s ease; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-gray-50 font-sans flex h-screen overflow-hidden">

<!-- Dynamic Sidebar -->
<aside class="fixed left-0 top-0 h-screen bg-white shadow-xl z-50 w-20 hover:w-64 transition-all duration-300 ease-in-out flex flex-col justify-between py-6 px-4 group border-r border-gray-100 flex-shrink-0">
    <div class="space-y-8 flex flex-col h-full overflow-hidden">
        <div class="flex items-center space-x-3 overflow-hidden flex-shrink-0">
            <img src="gsspicture.jpg" alt="GSS Logo" class="h-10 w-10 object-contain flex-shrink-0">
            <span class="font-bold text-stone-800 text-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">GSS LMS</span>
        </div>
        <nav id="sidebar-nav" class="space-y-1.5 flex-1 overflow-y-auto overflow-x-hidden pr-1 custom-scroll"></nav>
    </div>
    <div class="text-xs text-stone-400 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap flex-shrink-0">
        &copy; 2026 GSS Solution
    </div>
</aside>

<!-- Main Content Wrapper -->
<div class="flex-1 ml-20 p-8 h-full overflow-y-auto">
    <main class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-gray-100">
        <div class="flex items-center justify-between mb-6">
            <h1 class="font-display text-3xl sm:text-4xl font-semibold text-stone-950 tracking-tight">Profile</h1>
            <span id="role-badge" class="px-3 py-1 text-xs font-semibold rounded-full bg-blue-50 text-blue-700">Role</span>
        </div>

        <!-- Profile Preview Box -->
        <div class="flex items-center space-x-4 mb-6 p-4 bg-stone-50 rounded-xl border border-stone-100">
            <div class="w-16 h-16 rounded-full overflow-hidden bg-stone-200 border-2 border-white shadow-sm flex items-center justify-center flex-shrink-0">
                <img id="profile-preview-img" src="" alt="Profile" class="w-full h-full object-cover hidden">
                <svg id="profile-default-svg" class="w-8 h-8 text-stone-400" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
            </div>
            <div>
                <h3 id="preview-name-text" class="text-lg font-bold text-stone-800">User Name</h3>
                <p id="preview-role-text" class="text-xs text-stone-500 font-medium">Role Details</p>
            </div>
        </div>

        <form id="profile-form" class="space-y-5">
            <div class="form-row space-y-2">
                <div class="flex justify-between items-center">
                    <label for="profile-picture" class="block text-xs font-semibold uppercase tracking-wider text-stone-700">
                        Profile Picture (Upload new to replace)
                    </label>
                    <button
                            type="button"
                            id="edit-btn"
                            class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-medium text-xs rounded-lg shadow-sm transition flex items-center gap-1.5 focus:outline-none">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                        </svg>
                        Edit Profile
                    </button>
                </div>
                <input
                        type="file"
                        id="profile-picture"
                        accept="image/*"
                        disabled
                        class="w-full text-sm text-stone-500 file:mr-4 file:py-3 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 border border-gray-300 rounded-lg p-2 bg-white transition disabled:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-60">
            </div>

            <div class="form-row space-y-2">
                <label for="Preferred-first-name" class="block text-xs font-semibold uppercase tracking-wider text-stone-700">Name</label>
                <input
                        type="text"
                        id="Preferred-first-name"
                        placeholder="e.g. Kavindu Nirmal"
                        disabled
                        class="w-full px-4 py-3 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
            </div>

            <div class="form-row space-y-2">
                <label for="date-of-birth" class="block text-xs font-semibold uppercase tracking-wider text-stone-700">Date of Birth</label>
                <input
                        type="date"
                        id="date-of-birth"
                        disabled
                        class="w-full px-4 py-3 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
            </div>

            <div class="form-row space-y-2">
                <label for="national-id" class="block text-xs font-semibold uppercase tracking-wider text-stone-700">NIC</label>
                <input
                        type="text"
                        id="national-id"
                        placeholder="e.g. 961234567V"
                        disabled
                        class="w-full px-4 py-3 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
            </div>

            <div class="form-row space-y-2">
                <label for="telephone-number" class="block text-xs font-semibold uppercase tracking-wider text-stone-700">Telephone Number</label>
                <input
                        type="tel"
                        id="telephone-number"
                        placeholder="e.g. 0712345678"
                        disabled
                        class="w-full px-4 py-3 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed">
            </div>

            <div class="pt-4">
                <button
                        type="submit"
                        id="save-btn"
                        disabled
                        class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm rounded-lg shadow-sm transition focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:bg-gray-300 disabled:cursor-not-allowed">
                    Save Changes
                </button>
            </div>
        </form>
    </main>
</div>

<script>
    const supabaseClient = window.LMS.db;
    const session = LMS.getSession();

    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const profilePicInput = document.getElementById('profile-picture');
    const profileNameInput = document.getElementById('Preferred-first-name');
    const nicInput = document.getElementById('national-id');
    const dobInput = document.getElementById('date-of-birth');
    const phoneInput = document.getElementById('telephone-number');
    const profileForm = document.getElementById('profile-form');
    const roleBadge = document.getElementById('role-badge');
    const previewNameText = document.getElementById('preview-name-text');
    const previewRoleText = document.getElementById('preview-role-text');
    const profilePreviewImg = document.getElementById('profile-preview-img');
    const profileDefaultSvg = document.getElementById('profile-default-svg');

    const ROLE_CFG = {
        super_admin: { table: 'super_admin', storageKey: 'currentSuperAdmin', nameCol: 'super_admin_name', gidCol: 'super_admin_g_id', label: 'Super Admin' },
        admin:       { table: 'admins',      storageKey: 'currentAdmin',      nameCol: 'admin_name',       gidCol: 'admin_g_id',       label: 'Admin' },
        qat:         { table: 'qats',        storageKey: 'currentQat',        nameCol: 'name',             gidCol: 'qat_g_id',         label: 'QAT Technician' }
    };

    if (session) {
        const cfg = ROLE_CFG[session.role];
        let userData = session.user;
        let uploadedImageBase64 = userData.profile_picture || '';

        function getIdentifier() {
            if (userData.id) return { key: 'id', val: userData.id };
            if (userData[cfg.gidCol]) return { key: cfg.gidCol, val: userData[cfg.gidCol] };
            return { key: 'user_name', val: userData.user_name };
        }

        function updateRoleBadge() {
            if (session.role === 'super_admin') {
                roleBadge.textContent = 'Super Admin';
                roleBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-purple-50 text-purple-700';
            } else if (session.role === 'admin') {
                roleBadge.textContent = 'Admin';
                roleBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-blue-50 text-blue-700';
            } else {
                roleBadge.textContent = 'QAT Technician';
                roleBadge.className = 'px-3 py-1 text-xs font-semibold rounded-full bg-emerald-50 text-emerald-700';
            }
        }

        function loadUserData() {
            const displayName = userData[cfg.nameCol] || userData.name || userData.user_name || 'User';
            profileNameInput.value = displayName;
            dobInput.value = userData.dob || '';
            nicInput.value = userData.nic || '';
            phoneInput.value = userData.contact || userData.phone || '';

            previewNameText.textContent = displayName;
            previewRoleText.textContent = `ID: ${userData[cfg.gidCol] || userData.id || 'N/A'} (${cfg.label})`;

            if (userData.profile_picture && userData.profile_picture.trim() !== '') {
                profilePreviewImg.src = userData.profile_picture;
                profilePreviewImg.classList.remove('hidden');
                profileDefaultSvg.classList.add('hidden');
            } else {
                profilePreviewImg.classList.add('hidden');
                profileDefaultSvg.classList.remove('hidden');
            }
        }

        async function fetchLatestUserData() {
            try {
                const { key, val } = getIdentifier();
                if (val) {
                    const { data, error } = await supabaseClient.from(cfg.table).select('*').eq(key, val).single();
                    if (!error && data) {
                        userData = data;
                        localStorage.setItem(cfg.storageKey, JSON.stringify(userData));
                    }
                }
            } catch (err) {
                console.error('Error fetching latest user data:', err);
            }
            loadUserData();
        }

        profilePicInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    uploadedImageBase64 = uploadEvent.target.result;
                    profilePreviewImg.src = uploadedImageBase64;
                    profilePreviewImg.classList.remove('hidden');
                    profileDefaultSvg.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        LMS.renderSidebar();
        updateRoleBadge();
        fetchLatestUserData();

        editBtn.addEventListener('click', function() {
            profilePicInput.disabled = false;
            profileNameInput.disabled = false;
            dobInput.disabled = false;
            nicInput.disabled = false;
            phoneInput.disabled = false;
            saveBtn.disabled = false;
            profileNameInput.focus();
        });

        profileForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const updateData = {};

            if (profileNameInput.value.trim() !== '') {
                const newName = profileNameInput.value.trim();
                userData[cfg.nameCol] = newName;
                updateData[cfg.nameCol] = newName;
            }
            if (profilePicInput.files.length > 0 && uploadedImageBase64) {
                userData.profile_picture = uploadedImageBase64;
                updateData.profile_picture = uploadedImageBase64;
            }
            if (dobInput.value.trim() !== '') {
                userData.dob = dobInput.value.trim();
                updateData.dob = userData.dob;
            }
            if (nicInput.value.trim() !== '') {
                userData.nic = nicInput.value.trim();
                updateData.nic = userData.nic;
            }
            if (phoneInput.value.trim() !== '') {
                userData.contact = phoneInput.value.trim();
                updateData.contact = userData.contact;
            }

            try {
                const { key, val } = getIdentifier();
                if (val && Object.keys(updateData).length > 0) {
                    const { error } = await supabaseClient.from(cfg.table).update(updateData).eq(key, val).select();
                    if (error) {
                        console.error('Supabase update error:', error);
                        alert('Database update error: ' + error.message);
                        return;
                    }
                }
            } catch (err) {
                console.error('Database connection error:', err);
            }

            localStorage.setItem(cfg.storageKey, JSON.stringify(userData));

            profilePicInput.disabled = true;
            profileNameInput.disabled = true;
            dobInput.disabled = true;
            nicInput.disabled = true;
            phoneInput.disabled = true;
            saveBtn.disabled = true;
            profilePicInput.value = '';

            loadUserData();
            alert('Profile details updated successfully!');
        });
    }
</script>

</body>
</html>
